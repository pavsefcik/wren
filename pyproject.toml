[project]
name = "wren"
version = "0.1.0"
description = "A CLI + OpenAI-compatible server that runs Qwen3.6-35B-A3B MoE on a memory-constrained Mac using predictive expert prefetching."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.24.0",
    "mlx-vlm==0.4.4",
    "safetensors",
    "huggingface-hub",
    "fastapi",
    "uvicorn",
    "typer",
    "rich",
    "numpy",
    "ml-dtypes>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
wren = "wren.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wren"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
