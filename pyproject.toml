[project]
name = "wren"
version = "0.2.0"
description = "A CLI + OpenAI-compatible server that runs Qwen3.6-35B-A3B MoE on a memory-constrained Mac using predictive expert prefetching."
readme = "README.md"
requires-python = ">=3.12"
# NOTE: wren deliberately declares NO runtime dependencies here. mlx-vlm is only
# installable via a package manager together with its `datasets`/`opencv-python`
# tree (~280 MB that wren, being text-only, never imports). `pyproject.toml` is
# therefore packaging metadata only; the lean runtime env is built with
#   scripts/bootstrap.sh   (installs mlx-vlm --no-deps + only the core deps)
# and run via   ./.venv/bin/wren . Do NOT use `uv sync` / `uv run` to manage this
# env — uv would re-add the bloat or strip the bootstrap packages.

[project.scripts]
wren = "wren.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wren"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]